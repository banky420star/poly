gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"

# 0 = run forever. For first smoke test, set to 1 or 3.
dry_run_iterations = 0
loop_interval_ms = 3000

[paper]
starting_cash_usdc = "90"
ledger_state_path = "paper_state.json"
ledger_events_path = "paper_ledger.jsonl"

# record_only: records quote intents but does not pretend they filled.
# immediate: fills every accepted paper quote immediately for test/demo only.
fill_mode = "immediate"

[risk]
max_total_exposure_usdc = "200000"
max_market_exposure_usdc = "50000"
max_order_usdc = "1000"
min_cash_buffer_usdc = "1"
max_open_intents = 10000
max_daily_trades = 200000

[strategy]
name = "reactive_directional_v1"
min_yes_mid = "0.05"
max_yes_mid = "0.95"
maker_edge_bps = 200
quote_spread_bps = 200
allow_buy_yes = true
allow_buy_no = true

# Directional loading parameters — tuned for 5m/15m crypto scalps
directional_load_window_seconds = 120
min_skew_ratio = 0.4
reference_feed = "binance"

# Take-profit / stop-loss — adjusted for 7% taker fees
# Round-trip taker cost = ~14% (700bps each side)
# With MAKER orders (0% fee): much more viable
# TP must exceed fee drag; SL cuts losers before fees compound
take_profit_bps = 1500
stop_loss_bps = 800
min_hold_seconds = 10

[fees]
# Actual fee schedule for crypto Up/Down markets (feeType: crypto_fees_v2)
# Taker rate = 7% (700 bps), maker rebate = 20% of taker fee
maker_fee_bps = 0
taker_fee_bps = 700
prefer_maker = true

[market_filter]
limit = 150
require_active = true
require_open = true
# STRICT crypto-only keywords — includes "up or down" pattern for ephemeral 5m/15m markets
keywords = ["up or down", "bitcoin", "btc", "ethereum", "eth", "solana", "sol ", "crypto", "cryptocurrency"]
# Block everything non-crypto as safety net
exclude_keywords = ["gta", "album", "kiss", "jesus", "world cup", "fifa", "carti", "rihanna", "playboi", "nba", "nhl", "nfl", "mlb", "stanley cup", "finals", "nomination", "weinstein", "prison", "sentenced", "airdrop", "invade", "china"]
# Lower thresholds for ephemeral crypto markets (lighter order books)
min_depth_usdc = "10"
min_liquidity_usdc = "100"