gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"
dry_run_iterations = 0
loop_interval_ms = 3000

[paper]
starting_cash_usdc = "100"
ledger_state_path = "paper_state.json"
ledger_events_path = "paper_ledger.jsonl"
fill_mode = "immediate"

[risk]
# Tight limits — compounding mode overrides these with equity percentages
max_total_exposure_usdc = "13"
max_market_exposure_usdc = "6"
max_order_usdc = "5"
min_cash_buffer_usdc = "8"
max_open_intents = 6
max_daily_trades = 50
live_min_balance_usdc = 30
max_data_age_ms = 4000
require_clean_build_for_live = true

[ai]
enabled = false
signal_file = "ai_signal.json"
min_edge = 0.04
min_confidence = 0.65
max_signal_age_ms = 60000
shadow_mode = true

[lstm]
sequence_len = 60
prediction_horizon_secs = 60
model_path = "models/lstm_edge.pt"

[ppo]
model_path = "models/ppo_policy.zip"
allow_live_execution = false

[polymarket_ai_guardrails]
min_seconds_to_expiry = 90
min_spread = 0.01
max_spread = 0.08
min_depth_usdc = 0.0
avoid_if_no_exit_bid = true
maker_only = true

[strategy]
name = "reactive_directional_v2_imbalance"
min_yes_mid = 0.28
max_yes_mid = 0.72
maker_edge_bps = 150
quote_spread_bps = 250
allow_buy_yes = true
allow_buy_no = true
directional_load_window_seconds = 550          # 150s – 550s left
min_skew_ratio = 3.2                           # was 2.0
min_depth_usdc = 25000
reference_feed = "binance"
take_profit_bps = 1500
stop_loss_bps = 800
min_hold_seconds = 10

# NEW: Imbalance & Hybrid Signal
use_orderbook_imbalance = true
imbalance_weight = 0.40                        # 40% weight on imbalance
momentum_weight = 0.60                         # 60% weight on momentum
min_combined_skew = 2.8                        # final combined skew threshold

[compound]
enabled = true
max_order_pct = 0.50                 # 50% of equity per bet
max_exposure_pct = 0.60              # 60% max deployed
min_cash_buffer_pct = 0.20           # 20% reserve
base_bet_pct = 0.20                  # 20% base bet for market-making

[fees]
maker_fee_rate = "0.0"               # Polymarket: 0 fee for makers
crypto_taker_fee_rate = "0.07"       # Polymarket crypto taker coefficient
prefer_maker = true

[execution]
maker_first = true
maker_ttl_ms = 12000
replace_if_drift_ticks = 2
replace_if_age_ms = 9000
max_slippage_bps = 80

[market_filter]
limit = 15
require_active = true
require_open = true
keywords = ["bitcoin", "btc", "ethereum", "eth", "solana", "sol", "crypto"]
exclude_keywords = ["sports", "election", "politics", "trump", "biden", "nfl", "nba", "mlb"]
min_depth_usdc = "5"                 # lowered for small account
